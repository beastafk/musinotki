server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Note: add_header inside a location replaces server-level headers,
    # so security headers are repeated per location.

    # Vite output has content hashes in file names — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Un-hashed static files (font, favicons) — cache, but revalidate
    location ~* \.(woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA entry — always revalidate so new deploys are picked up
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
